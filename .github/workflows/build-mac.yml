# Builds the Mac app on GitHub's free runners and attaches the .dmg to a
# release. Runs when you push to main, or from Actions › Build the Mac app ›
# Run workflow.
#
# The app is not signed with an Apple Developer certificate (that costs
# $99/year), so the first time you open it macOS will warn you: right-click
# the app and choose Open. See README.md.
name: Build the Mac app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mac
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: npm run build

  mac:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      # Updates are signed with the key in the TAURI_SIGNING_PRIVATE_KEY secret.
      # Until that secret exists the app still builds, just without updates.
      - name: Is the update signing key set?
        id: sign
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "extra=" >> "$GITHUB_OUTPUT"; else echo "extra=--config src-tauri/no-updater.json" >> "$GITHUB_OUTPUT"; echo "::warning::No TAURI_SIGNING_PRIVATE_KEY secret: building without self-update files."; fi
      # One .dmg that runs on both Apple silicon and Intel Macs, plus the signed
      # update bundle and latest.json the app checks for new versions.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          args: --target universal-apple-darwin ${{ steps.sign.outputs.extra }}
          includeUpdaterJson: true
          tagName: v__VERSION__
          releaseName: Nosprhite v__VERSION__
          releaseBody: Download the .dmg below, open it, and drag Nosprhite to Applications. The first time, right-click it and choose Open.
          releaseDraft: false
          prerelease: false
